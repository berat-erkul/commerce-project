services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: commerce-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: commerce-kafka-ui

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: commerce-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

  postgres-order:
    image: postgres:16
    container_name: commerce-postgres-order
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    volumes:
      - pg_order_data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:16
    container_name: commerce-postgres-payment
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - pg_payment_data:/var/lib/postgresql/data

  postgres-inventory:
    image: postgres:16
    container_name: commerce-postgres-inventory
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - pg_inventory_data:/var/lib/postgresql/data

  postgres-saga:
    image: postgres:16
    container_name: commerce-postgres-saga
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: sagadb
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    volumes:
      - pg_saga_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    ports:
      - "6379:6379"

volumes:
  kafka_data:
  pg_order_data:
  pg_payment_data:
  pg_inventory_data:
  pg_saga_data:
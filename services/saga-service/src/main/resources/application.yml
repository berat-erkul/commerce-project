server:
  port: 8089

spring:
  application:
    name: saga-service
  datasource:
    url: jdbc:postgresql://localhost:5436/sagadb
    username: ${DB_USER:saga}
    password: ${DB_PASSWORD:saga}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: saga-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      properties:
        enable.idempotence: true

# Saga watcher konfigürasyonu — compensation retry zamanlaması
saga:
  watcher:
    poll-interval-ms: 5000
  compensation:
    max-retry-attempts: 10
    initial-backoff-ms: 1000
    max-backoff-ms: 14400000   # 4 saat
    backoff-multiplier: 2.0
    jitter-percent: 25         # ±%25 jitter (thundering herd önleme)

# Outbox poller
outbox:
  poll-interval-ms: 1000
  batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.commercelab: DEBUG
    org.springframework.kafka: INFO

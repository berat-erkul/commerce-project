server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/orderdb
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:order}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # NOTE: enable.idempotence=true broker'da aynı session içindeki retry
        # duplicate'lerini yutar (PID + sequence number). Worker restart sonrası
        # PID yenilenir, koruma BOZULUR. Cross-restart exactly-once için
        # transactional.id eklenmesi gerekir — bu Hafta 2 / M2'de outbox publisher
        # worker yazılırken konuşulacak. Şimdilik consumer-side processed_events
        # tablosu (Katman 1) restart duplicate'lerini yakalayacak.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.commercelab: DEBUG
    org.springframework.kafka: INFO
